<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Umur Çelebi | Yazılım & Uygulama Geliştiricisi</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --muted: #94a3b8;
            --accent: #107c10; /* Xbox Yeşili */
            --accent-hover: #0e6b0e;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
        .container {
            max-width: 700px;
            margin: 60px auto;
            padding: 0 20px;
        }
        header {
            text-align: center;
            margin-bottom: 50px;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        .subtitle {
            color: var(--muted);
            font-size: 1.1rem;
        }
        .projects {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
        .card {
            background: var(--card);
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #334155;
            text-align: center;
        }
        .badge {
            display: inline-block;
            background: rgba(16, 124, 16, 0.2);
            color: #4ade80;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .card h3 {
            margin-top: 0;
            font-size: 1.5rem;
            color: #f8fafc;
        }
        .card p {
            color: var(--muted);
            font-size: 1rem;
        }
        .btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 24px;
            background: var(--accent);
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 500;
            font-size: 0.95rem;
            transition: background 0.2s;
        }
        .btn:hover {
            background: var(--accent-hover);
        }
        footer {
            text-align: center;
            margin-top: 60px;
            padding-top: 20px;
            border-top: 1px solid #334155;
            color: var(--muted);
            font-size: 0.9rem;
        }
        footer a {
            color: #60a5fa;
            text-decoration: none;
        }
        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Merhaba, Ben Umur Çelebi</h1>
            <p class="subtitle">Yazılım & Uygulama Geliştiricisi</p>
        </header>

        <div class="projects">
            <!-- Proje 1 -->
            <div class="card">
                <span class="badge">Xbox Series S | X</span>
                <h3>XUBO IPTV</h3>
                <p>Xbox Series S ve Series X konsolları için geliştirilmiş modern ve hızlı IPTV medya oynatıcı uygulaması.</p>
                <a href="#" class="btn">Yakında XBOX Store'da</a>
            </div>
        </div>

        <footer>
            <p>İletişim & Destek: <strong><a href="mailto:umurcelebi@gmail.com">umurcelebi@gmail.com</a></strong></p>
        </footer>
    </div>

</body>
</html>
