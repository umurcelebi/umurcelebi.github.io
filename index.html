<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XUBO — IPTV Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Subtle Analog Film Grain Overlay -->
  <div class="film-grain" aria-hidden="true"></div>

  <!-- Ambient Studio Spotlight -->
  <div class="cursor-spotlight" id="cursorSpotlight" aria-hidden="true"></div>

  <main class="monolith-stage">
    <div class="hero-backdrop-glow" aria-hidden="true"></div>

    <div class="brand-monument">
      <div class="logo-frame">
        <img src="xubo-logo.png" alt="XUBO" class="xubo-hero-logo" />
      </div>

      <div class="hero-kicker">
        <span class="kicker-line"></span>
        <span class="mono-tag">PREMIUM IPTV PLAYER</span>
        <span class="kicker-line"></span>
      </div>

      <h1 class="hero-headline">
        Görüntünün en saf,<br />
        <span class="headline-accent">en sessiz formu.</span>
      </h1>

      <p class="hero-lead">
        Premium Özellikli IP TV - Hem de Ücretsiz!
      </p>

      <div class="release-statement">
        <span class="pulse-dot" aria-hidden="true"></span>
        <p class="release-text">
          Yakında <strong>Xbox Series X/S</strong> ve <strong>Samsung Tizen OS</strong> platformlarında yayında
        </p>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <a href="privacy.html" class="privacy-link">
      Privacy Policy
    </a>
  </footer>

  <script src="app.js"></script>
</body>
</html>
