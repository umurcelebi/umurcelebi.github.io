<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geliştirici Portfolyosu & Uygulamalar</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --muted: #94a3b8;
            --accent: #3b82f6;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 60px auto;
            padding: 0 20px;
        }
        header {
            text-align: center;
            margin-bottom: 50px;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        .subtitle {
            color: var(--muted);
            font-size: 1.1rem;
        }
        .projects {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
        .card {
            background: var(--card);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #334155;
        }
        .card h3 {
            margin-top: 0;
            color: #60a5fa;
        }
        .card p {
            color: var(--muted);
            font-size: 0.95rem;
        }
        .btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 18px;
            background: var(--accent);
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 500;
            font-size: 0.9rem;
        }
        .btn:hover {
            background: #2563eb;
        }
        footer {
            text-align: center;
            margin-top: 60px;
            padding-top: 20px;
            border-top: 1px solid #334155;
            color: var(--muted);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Merhaba, Ben Umur Çelebi</h1>
            <p class="subtitle">Yazılım & Uygulama Geliştiricisi</p>
        </header>

        <div class="projects">
            <!-- Proje 1 -->
            <div class="card">
                <h3>Uygulama / XUBO IPTV</h3>
                <p>Xbox Series S/X için IPTV Uygulaması</p>
                <a href="#" class="btn">İncele / İndir</a>
            </div>

      
        </div>

        <footer>
            <p>İletişim & Destek: <strong>umurcelebi@gmail.com/strong></p>
        </footer>
    </div>

</body>
</html>
